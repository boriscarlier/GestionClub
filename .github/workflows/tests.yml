name: Tests Gestion Club

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_server
          - test_watch
          - test_manual_watch
          - test_pdf_watch
          - test_convocations
          - test_lan_server
          - test_windows_runtime
          - test_html_decomposition
          - test_manager_page_index
          - test_manager_assets
          - test_manager_css
          - test_manager_sources
          - test_installation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run module
        env:
          PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/vendor:${{ github.workspace }}/tests:${{ github.workspace }}/scripts
        run: python3 -m unittest -v tests.${{ matrix.module }}

  modular-browser:
    name: Modular browser parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          npm install --prefix "$RUNNER_TEMP/gestionclub-browser" playwright@1.62.1 pngjs@7.0.0
          node "$RUNNER_TEMP/gestionclub-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compare legacy and modular pages
        run: NODE_PATH="$RUNNER_TEMP/gestionclub-browser/node_modules" node scripts/check_modular_browser.cjs
      - name: Keep comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modular-browser-report
          path: releases/modular-qa/

  windows-update:
    name: Windows Python 3.14 update and encoding
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test real copy and full suite without forced UTF-8 mode
        shell: pwsh
        env:
          PYTHONPATH: server;vendor;tests;scripts
          PYTHONUTF8: '0'
        run: python -X utf8=0 -m unittest discover -s tests -q
