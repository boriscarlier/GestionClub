name: Tests Gestion Club

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run test suite
        run: ./scripts/run_tests.sh
