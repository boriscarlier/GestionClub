name: Tests Gestion Club

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'refactor/**'
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - test_server
          - test_watch
          - test_manual_watch
          - test_pdf_watch
          - test_convocations
          - test_lan_server
          - test_windows_runtime
          - test_html_decomposition
          - test_manager_page_index
          - test_manager_assets
          - test_manager_css
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run module
        env:
          PYTHONPATH: ${{ github.workspace }}/server:${{ github.workspace }}/vendor:${{ github.workspace }}/tests:${{ github.workspace }}/scripts
        run: python3 -m unittest -v tests.${{ matrix.module }}
